# Add to ggtech-nginx-live as /etc/nginx/conf.d/career.conf
# Uses Docker's internal DNS + a variable, so nginx (and ggtech.info) still starts even if the career container is down.

server {
    listen 80;
    server_name career.ggtech.info;

    # Let's Encrypt HTTP challenge (served from /var/www/ggtech.info on the host)
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name career.ggtech.info;

    ssl_certificate     /etc/letsencrypt/live/career.ggtech.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/career.ggtech.info/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $career_upstream http://career-students:5010;

    location / {
        proxy_pass $career_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
