server {
    listen 5010;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # service worker & manifest must never be cached long, so updates reach students
    location = /sw.js              { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; default_type application/manifest+json; try_files $uri =404; }
    location /data/                { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /assets/              { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    # single-page app: every route falls back to index.html
    location / { try_files $uri $uri/ /index.html; }
}
